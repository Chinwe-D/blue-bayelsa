# HTTPS (Let's Encrypt) is added in Phase 11; this is the plain-HTTP base.
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { alias /srv/static/; expires 7d; }
    # The React web app will be served from here in Phase 6/7.
    location / { return 200 "Blue Bayelsa Invest – web app coming soon\n"; add_header Content-Type text/plain; }
}
